name: Publish story site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # Pinned to the Quarto version of the local QA render (task 18.6,
        # v1; Decision 28 point 7). Change it only with SITE_QUARTO_VERSION
        # in R/00_config.R and a new QA (scripts/11_build_site.R STEP 18.2).
        with:
          version: 1.10.18

      # The pages hold no R code (Decision 28 c1): scripts/11_build_site.R
      # writes the figures and the tables into site/ on the local machine, so
      # the Action needs only Quarto, not R. A page with R code would need a
      # committed site/_freeze/ (freeze: auto in site/_quarto.yml).
      - name: Render site
        run: quarto render site

      - name: Deploy to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
