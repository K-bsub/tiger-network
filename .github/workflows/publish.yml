name: Publish story site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The site is rendered LOCALLY and its computed output is frozen in
      # site/_freeze/ (committed). The Action therefore needs only Quarto, not
      # the R spatial stack. Re-render locally and commit site/_freeze/ whenever
      # a .qmd's code changes.
      - name: Render site (from freeze)
        run: quarto render site

      - name: Deploy to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
